name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (v + the version in package.json) with the Windows and Mac downloads
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end (Electron, software WebGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install xvfb and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - run: npm ci
      - name: Run the scenarios
        run: npm run e2e
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: |
            .e2e/shots-*
            .e2e/*.log
          if-no-files-found: ignore
          include-hidden-files: true # .e2e is a hidden folder

  e2e-mac:
    name: End-to-end on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: npm ci
      # The app starting up, the 3D body and mouse input, and the iTunes library.
      - name: Run the scenarios
        run: bash scripts/run-e2e.sh tour motion itunes
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-mac
          path: |
            .e2e/shots-*
            .e2e/*.log
          if-no-files-found: ignore
          include-hidden-files: true # .e2e is a hidden folder

  windows:
    name: Windows installer and portable
    runs-on: windows-latest
    needs: [check, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: iPod-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.exe.blockmap
          if-no-files-found: error

  mac:
    name: Mac app (Apple silicon and Intel)
    runs-on: macos-latest
    needs: [check, e2e-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ad-hoc signed (package.json › build.mac.identity "-"): not notarized,
      # but Apple silicon Macs will open it.
      - name: Build the disk images
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: iPod-mac
          path: dist/*.dmg
          if-no-files-found: error

  # A release is published for a pushed v* tag, or when the workflow is run by
  # hand with "release" ticked (tagged v + the version in package.json).
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iPod-*
          path: artifacts
      - name: Release notes
        id: notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.js "$tag" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: iPod ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          # latest.yml and the blockmap are what installed Windows copies read to update themselves.
          files: |
            artifacts/iPod-windows/*.exe
            artifacts/iPod-windows/latest.yml
            artifacts/iPod-windows/*.exe.blockmap
            artifacts/iPod-mac/*.dmg
