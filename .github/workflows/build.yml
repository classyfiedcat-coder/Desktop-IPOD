name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (v + the version in package.json) with the Windows downloads
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end (Electron, software WebGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install xvfb and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb ffmpeg
      - run: npm ci
      - name: Run the scenarios
        run: npm run e2e
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: |
            .e2e/shots-*
            .e2e/*.log
          if-no-files-found: ignore

  windows:
    name: Windows installer and portable
    runs-on: windows-latest
    needs: [check, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: iPod-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
      # A release is published for a pushed v* tag, or when the workflow is run
      # by hand with "release" ticked (tagged v + the version in package.json).
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.js "$tag" > release-notes.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: iPod ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          # latest.yml and the blockmap are what installed copies read to update themselves.
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
